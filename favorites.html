<!doctype html>
<html lang="en">

<head>
     <meta charset="UTF-8" />
     <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <title>Favorites | Book Explorer</title>
</head>

<body class="flex min-h-screen flex-col bg-gray-50 text-gray-800">

     <!-- NAVBAR -->
     <header class="sticky top-0 z-50 border-b border-white/10 bg-indigo-700/90 text-white shadow-lg backdrop-blur">
          <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between px-4">

               <!-- Logo -->
               <a href="index.html" class="flex items-center gap-2.5 font-bold">
                    <span
                         class="flex size-9 items-center justify-center rounded-xl bg-linear-to-br from-pink-400 to-orange-300 text-indigo-900 shadow-md">
                         <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                              stroke="currentColor" class="size-5">
                              <path stroke-linecap="round" stroke-linejoin="round"
                                   d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" />
                         </svg>
                    </span>
                    <span class="text-lg sm:text-xl">Book<span class="text-pink-200">Explorer</span></span>
               </a>

               <!-- Desktop / tablet links -->
               <ul class="hidden items-center gap-1 sm:flex">
                    <li><a href="index.html" class="rounded-full px-4 py-1.5 transition hover:bg-white/20">Home</a></li>
                    <li>
                         <a href="favorites.html"
                              class="flex items-center gap-1.5 rounded-full bg-white px-4 py-1.5 font-semibold text-indigo-700">
                              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                                   stroke="currentColor" class="size-4">
                                   <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
                              </svg>
                              Favorites
                         </a>
                    </li>
                    <li><a href="about.html" class="rounded-full px-4 py-1.5 transition hover:bg-white/20">About</a>
                    </li>
               </ul>

               <!-- Hamburger button (phones only) -->
               <button id="menu-btn" type="button" aria-label="Open menu" aria-expanded="false"
                    class="rounded-lg p-2 transition hover:bg-white/20 sm:hidden">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8"
                         stroke="currentColor" class="size-6">
                         <path stroke-linecap="round" stroke-linejoin="round"
                              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                    </svg>
               </button>
          </nav>

          <!-- Mobile menu -->
          <ul id="mobile-menu" class="hidden space-y-1 border-t border-white/10 px-4 py-3 sm:hidden">
               <li><a href="index.html" class="block rounded-lg px-3 py-2 transition hover:bg-white/20">Home</a></li>
               <li><a href="favorites.html"
                         class="block rounded-lg bg-white px-3 py-2 font-semibold text-indigo-700">Favorites</a></li>
               <li><a href="about.html" class="block rounded-lg px-3 py-2 transition hover:bg-white/20">About</a></li>
          </ul>
     </header>

     <!-- MAIN -->
     <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 md:py-12">

          <!-- MY FAVORITES -->
          <section>
               <h1 class="text-2xl font-bold">My Favorite Books</h1>

               <div id="favorites-grid" class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>

               <p id="empty-message" class="mt-8 hidden text-gray-500">
                    You have no favorite books yet. Add some from the list below.
               </p>
          </section>

          <!-- ALL BOOKS -->
          <section class="mt-16">
               <h2 class="text-2xl font-bold">All Books</h2>

               <div id="books-grid" class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4"></div>
          </section>

     </main>

     <!-- FOOTER -->
     <footer class="bg-gray-900 py-6 text-center text-sm text-gray-400">
          © 2026 Book Explorer. Built by Flora.
     </footer>

     <script type="module">
          import { initNavbar } from './src/navbar.js';
          initNavbar();
     </script>
     <script type="module" src="./src/favorites-page.js"></script>
</body>

</html>
